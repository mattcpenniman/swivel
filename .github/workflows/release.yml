name: Release

# Push a tag vX.Y.Z (matching swivel.__version__) to publish a release whose
# assets are the pure-Python wheel and the sdist. Consumers whose builds only
# accept wheels (e.g. Lambda: pip --only-binary=:all:) install the wheel URL.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test
        run: |
          python -m pip install -e ".[test,yaml]"
          python -m pytest -q

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Check tag, version and wheel tag agree
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/swivel/__init__.py').read_text()).group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          test -f "dist/swivel-${version}-py3-none-any.whl" || { ls dist; echo "expected a py3-none-any wheel"; exit 1; }

      - name: Install the way a Lambda build does, and smoke-test
        run: |
          python -m pip install --platform manylinux2014_x86_64 --python-version 3.13 \
            --implementation cp --only-binary=:all: --target lambda dist/*.whl
          PYTHONPATH=lambda python -s scripts/lambda_smoke.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "swivel ${GITHUB_REF_NAME#v}" --generate-notes
